[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "quantrocket-client"
description = "QuantRocket client"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dynamic = ["version"]

authors = [
    { name = "QuantRocket LLC" },
]

dependencies = [
    "requests",
    "six",
    "python-dateutil",
    "pyyaml",
]

[project.scripts]
quantrocket = "quantrocket._cli.commands:main"

[tool.setuptools]
packages = ["quantrocket"]
zip-safe = false

[tool.setuptools.package-data]
quantrocket = ["py.typed"]

[tool.setuptools_scm]
write_to = "quantrocket/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"